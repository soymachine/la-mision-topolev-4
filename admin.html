<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Archivo Topolev · Admin</title>
<meta name="description" content="Catálogo de todo el contenido de La Misión Topolev: armas, objetos, gadgets, chebylitas, zonas y módulos.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23000'/%3E%3Ctext x='8' y='13' font-size='13' text-anchor='middle' fill='%23ff8a1f' font-family='monospace'%3E%E2%98%B0%3C/text%3E%3C/svg%3E">
<style>
  :root {
    --bg: #000; --bg2: #0b0603; --bg3: #160c05; --line: #3a1c06; --line2: #5a2c0a;
    --o0: #ffd7a8; --o1: #ffb35c; --o2: #ff8a1f; --o3: #d0650c; --o4: #8a3f08;
    --txt: #ffcf9a; --dim: #a8692f; --good: #3ddc6b; --bad: #ff3b30; --cyan: #5ff7ff;
    --font: "JetBrains Mono", "DejaVu Sans Mono", Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--txt); font: 13px/1.5 var(--font); }
  a { color: var(--o1); }
  ::selection { background: var(--o2); color: #000; }
  .app { display: grid; grid-template-columns: 30ch 1fr; height: 100vh; }
  nav { border-right: 1px solid var(--line); overflow-y: auto; padding: 1em 0; background: var(--bg2); }
  nav h1 { font-size: 13px; color: var(--o2); letter-spacing: .2em; margin: 0 1.5ch 1em; font-weight: 800; }
  nav h1 small { display: block; color: var(--dim); letter-spacing: .05em; font-weight: 400; }
  nav .grp { color: var(--o4); font-size: 11px; letter-spacing: .15em; margin: 1em 1.5ch .3em; }
  nav a { display: flex; justify-content: space-between; padding: 2px 1.5ch; text-decoration: none; color: var(--o1); border-left: 1ch solid transparent; }
  nav a:hover { background: var(--bg3); }
  nav a.on { background: var(--o2); color: #000; font-weight: 700; }
  nav a .n { color: var(--dim); }
  nav a.on .n { color: #000; }
  nav .back { margin: 1.5em 1.5ch 0; display: block; color: var(--dim); }
  main { overflow-y: auto; padding: 1.5em 3ch 4em; }
  header.top { display: flex; align-items: baseline; gap: 2ch; flex-wrap: wrap; margin-bottom: .5em; }
  header.top h2 { margin: 0; color: var(--o2); font-size: 18px; letter-spacing: .12em; }
  header.top .sub { color: var(--dim); }
  .intro { color: var(--dim); max-width: 100ch; margin: 0 0 1em; }
  .search { margin-left: auto; background: #000; border: 1px solid var(--line2); color: var(--o0); font: inherit; padding: 4px 1ch; width: 32ch; }
  .search:focus { outline: 1px solid var(--o2); }
  table { border-collapse: collapse; width: 100%; }
  th { text-align: left; color: var(--o3); font-weight: 700; border-bottom: 1px solid var(--line2); padding: 4px 1.5ch 4px 0; white-space: nowrap; position: sticky; top: -1.5em; background: var(--bg); cursor: pointer; user-select: none; }
  th:hover { color: var(--o1); }
  th.sorted::after { content: " ▾"; } th.sorted.asc::after { content: " ▴"; }
  td { padding: 5px 1.5ch 5px 0; border-bottom: 1px dashed var(--line); vertical-align: top; }
  tr:hover td { background: var(--bg2); }
  td.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  td.g { font-weight: 800; font-size: 16px; text-align: center; width: 3ch; }
  .nm { color: var(--o0); font-weight: 700; }
  .desc { color: var(--dim); font-size: 12px; max-width: 60ch; }
  .tag { display: inline-block; padding: 0 .8ch; margin: 1px .5ch 1px 0; border: 1px solid var(--line2); color: var(--o1); font-size: 11px; white-space: nowrap; }
  .tag.c { border-color: #1d5a5c; color: var(--cyan); }
  .tag.g { border-color: #1d5a2c; color: var(--good); }
  .tag.b { border-color: #5a1d1a; color: #ff7a6a; }
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(26ch, 1fr)); gap: 1.5ch; margin: 1em 0; }
  .card { border: 1px solid var(--line2); padding: 1em 1.5ch; background: var(--bg2); text-decoration: none; display: block; color: var(--txt); }
  .card:hover { border-color: var(--o2); background: var(--bg3); }
  .card .big { font-size: 26px; font-weight: 800; color: var(--o2); }
  .card .lb { color: var(--o1); font-weight: 700; }
  .card .dd { color: var(--dim); font-size: 12px; }
  .block { border: 1px solid var(--line); background: var(--bg2); padding: 1em 2ch; margin: 1em 0; }
  .block h3 { margin: 0 0 .5em; color: var(--o1); font-size: 14px; }
  td.nw { white-space: nowrap; }
  pre.art { font-size: 11px; line-height: 1.1; margin: .5em 0 0; text-shadow: 0 0 5px currentColor; opacity: .9; }
  .lvls span { display: inline-block; width: 3.2ch; text-align: center; font-weight: 800; }
  .bar { display: inline-block; height: 8px; background: var(--o3); vertical-align: middle; }
  .empty { color: var(--dim); padding: 2em 0; }
  .note { border-left: 3px solid var(--o3); padding: .5em 2ch; margin: .8em 0; background: var(--bg2); }
  .note .a { color: var(--dim); font-size: 12px; text-align: right; }
  @media (max-width: 800px) { .app { grid-template-columns: 1fr; grid-template-rows: auto 1fr; } nav { max-height: 40vh; border-right: 0; border-bottom: 1px solid var(--line); } .search { width: 100%; } }
</style>
</head>
<body>
<div class="app">
  <nav id="nav"></nav>
  <main id="main"></main>
</div>
<script type="module" src="js/admin.js"></script>
</body>
</html>
